name: memogram
description: "LST inc. Devs"
publish_to: 'none'
version: 0.3.3+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  flutter_markdown: ^0.7.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
  - assets/default.png